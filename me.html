// ── build nodes with 3D positions (center + categories on a sphere + leaves near cat) ──
let NODES = [], LINKS = [];

// ── deep background starfield (3D, rotates with the scene → 浩瀚星空) ──
const BGSTARS = (function(){
  const a=[];
  for(let i=0;i<820;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const R=520+Math.random()*1450;
    a.push({ x:R*Math.sin(ph)*Math.cos(th), y:R*Math.cos(ph), z:R*Math.sin(ph)*Math.sin(th),
      b:0.22+Math.random()*0.78, tw:Math.random()*6.283, sz:Math.random()<0.13?2.0:1.05,
      warm:Math.random()<0.16 });
  }
  return a;
})();
function fib(i, n){ // fibonacci sphere direction
  const phi = Math.acos(1 - 2*(i+0.5)/n);
  const th  = Math.PI*(1+Math.sqrt(5))*(i+0.5);
  return [Math.sin(phi)*Math.cos(th), Math.cos(phi)*0.72, Math.sin(phi)*Math.sin(th)];
}
function buildGraph(root){
  NODES=[]; LINKS=[];
  const R1=245, R2=98;
  const center={ id:'me', kind:'center', label:root.label||'小耳', en:root.en||'Xiaoer',
    sub:root.identity||root.sub||'', intro:root.hover||root.subtitle||'', introEn:root.hoverEn||HOVER_EN,
    about:root.about||null, action:root.action||'进一步认识小耳', url:'',
    x:0,y:0,z:0, r:8 };
  NODES.push(center);
  const cats=(root.children||[]);
  cats.forEach((cat,ci)=>{
    const d=fib(ci, cats.length);
    const cx=d[0]*R1, cy=d[1]*R1, cz=d[2]*R1;
    const cnode={ id:'cat'+ci, kind:'cat', label:cat.label, en:cat.en||'', sub:cat.en||'', intro:'', url:'',
      x:cx,y:cy,z:cz, r:4 };
    NODES.push(cnode); LINKS.push([center,cnode]);
    const leaves=(cat.children||cat.nodes||[]);
    leaves.forEach((lf,li)=>{
      // spread leaves around the category direction, on a small local ring tilted outward
      const a=(li/Math.max(1,leaves.length))*Math.PI*2 + ci*1.3;
      const up=Math.abs(d[1])>0.9?[1,0,0]:[0,1,0];
      const t1=norm(cross(d,up)), t2=norm(cross(d,t1));
      const spread=R2*(0.8+0.5*Math.random());
      const lx=cx + (Math.cos(a)*t1[0]+Math.sin(a)*t2[0])*spread + d[0]*52;
      const ly=cy + (Math.cos(a)*t1[1]+Math.sin(a)*t2[1])*spread + d[1]*52;
      const lz=cz + (Math.cos(a)*t1[2]+Math.sin(a)*t2[2])*spread + d[2]*52;
      const lnode={ id:'l'+ci+'_'+li, kind:'leaf', label:lf.label, en:lf.en||'', sub:lf.en||'',
        intro:(lf.url||lf.href||''), url:lf.url||lf.href||'',
        x:lx,y:ly,z:lz, r:2.4 };
      NODES.push(lnode); LINKS.push([cnode,lnode]);
      // sub-hub: 奇物录 / 馆藏站 再展开一层
      const enr = ENRICH[lf.label];
      if(enr){
        lnode.kind='subhub'; lnode.r=3.6; if(enr.current) lnode.current=true;
        const pd=norm([lx,ly,lz]);
        const pu=Math.abs(pd[1])>0.9?[1,0,0]:[0,1,0];
        const pt1=norm(cross(pd,pu)), pt2=norm(cross(pd,pt1));
        enr.subs.forEach((sb,si)=>{
          const sa=(si/enr.subs.length)*Math.PI*2 + li;
          const sx=lx + (Math.cos(sa)*pt1[0]+Math.sin(sa)*pt2[0])*enr.r2 + pd[0]*20;
          const sy=ly + (Math.cos(sa)*pt1[1]+Math.sin(sa)*pt2[1])*enr.r2 + pd[1]*20;
          const sz=lz + (Math.cos(sa)*pt1[2]+Math.sin(sa)*pt2[2])*enr.r2 + pd[2]*20;
          const snode={ id:lnode.id+'_s'+si, kind:'sub', label:sb.label, en:sb.en||'', sub:sb.en||'', url:sb.url||'', x:sx,y:sy,z:sz, r:1.8 };
          NODES.push(snode); LINKS.push([lnode,snode]);
        });
      }
    });
  });
}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}

let zoom=1;
let lineMode=1; // 0 微光渐变 · 1 虚线 · 2 无线 (按 L 循环对比)

});
window.addEventListener('wheel',e=>{

  zoom=Math.max(.55,Math.min(2.4,zoom*(e.deltaY>0?0.92:1.08)));
},{passive:false});
let mx=W/2,my=H/2;

function project(n){
  // rotate by yaw (around Y) then pitch (around X)
  const cy=Math.cos(yaw+autoYaw),sy=Math.sin(yaw+autoYaw);
  let x=n.x*cy - n.z*sy, z=n.x*sy + n.z*cy, y=n.y;
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  let y2=y*cp - z*sp, z2=y*sp + z*cp;
  const persp=420/(420 + z2); // perspective
  const s=persp*zoom;
  return { sx:W/2 + x*s, sy:H/2 + y2*s, z:z2, scale:s, persp };
}

// ── interaction: hover nearest projected node ──
let hover=null;
cv.addEventListener('click',()=>{
  if(moved)return;
  if(hover && hover.kind==='center') openAbout();
  else if(hover && hover.url) window.open(hover.url,'_blank','noopener');
});

// ── render loop ──
function frame(){
  autoYaw += dragging?0:0.00021;
  ctx.clearRect(0,0,W,H);
  // deep background starfield (behind everything)
  const now=performance.now()*0.001;
  for(const s of BGSTARS){
    const p=project(s);
    if(p.persp<=0.04) continue;
    const tw=0.6+0.4*Math.sin(now*1.2+s.tw);
    const al=s.b*tw*Math.min(1,p.persp*1.3);
    if(al<0.02) continue;
    ctx.fillStyle=s.warm?`rgba(255,205,170,${al})`:`rgba(240,244,255,${al})`;
    ctx.beginPath(); ctx.arc(p.sx,p.sy,Math.max(0.4,s.sz*p.persp),0,7); ctx.fill();
  }
  // compute projections
  const P = NODES.map(project);
  // hover pick (nearest within radius)
  hover=null; let best=1e9;
  for(let i=0;i<NODES.length;i++){
    const p=P[i]; const dd=Math.hypot(p.sx-mx,p.sy-my);
    const hitR = Math.max(14, NODES[i].r*p.scale+10);
    if(dd<hitR && dd<best){best=dd;hover=NODES[i];hover._p=p;}
  }
  updateInfo(hover);
  if(!dragging) cv.style.cursor = hover ? 'pointer' : 'grab';
  // links (draw back-to-front by mid z)
  const order=LINKS.map((L,i)=>({i,z:(project(L[0]).z+project(L[1]).z)/2})).sort((a,b)=>a.z-b.z);
  if(lineMode!==2) for(const {i} of order){
    const a=P[NODES.indexOf(LINKS[i][0])], b=P[NODES.indexOf(LINKS[i][1])];
    const active = hover && (LINKS[i][0]===hover||LINKS[i][1]===hover);
    // 星空里连线本是眼睛脑补的 —— 两端在星点处淡出,只在中段留一缕微光,视觉上更短更含蓄
    const mid=(a.persp+b.persp)/2;
    const A = active ? Math.min(0.5, (0.05+0.09*mid)*6) : Math.min(0.1, 0.02+0.05*mid);
    const col = active ? '255,124,58' : '188,184,200';
    ctx.lineWidth = active?1.0:0.5;
    if(lineMode===1){ // 虚线(faint dashed)
      ctx.save(); ctx.setLineDash([2,6]);
      ctx.strokeStyle=`rgba(${col},${Math.min(active?0.5:0.14, A+0.03)})`;
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
      ctx.restore();
    }else{ // 0: 微光渐变(两端淡出)
      const grad = ctx.createLinearGradient(a.sx,a.sy,b.sx,b.sy);
      grad.addColorStop(0,`rgba(${col},0)`);
      grad.addColorStop(active?0.28:0.36,`rgba(${col},${A})`);
      grad.addColorStop(active?0.72:0.64,`rgba(${col},${A})`);
      grad.addColorStop(1,`rgba(${col},0)`);
      ctx.strokeStyle=grad;
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
    }
  }
  // nodes back-to-front
  const nodeOrder=NODES.map((n,i)=>({i,z:P[i].z})).sort((a,b)=>a.z-b.z);
  for(const {i} of nodeOrder){
    const n=NODES[i], p=P[i];
    const depth=Math.max(0.25,p.persp);
    const isHover = hover===n;
    // 压缩透视对点半径的放大 —— 近处的点不再膨胀得过大
    const R=n.r*(0.62+0.38*p.persp)*zoom*(isHover?1.35:1);
    const coral = n.kind==='center' || isHover;
    // glow —— 光晕更大更饱满,让星点自身发光、压过连线(浩瀚星空感)
    const glowR = R*(n.kind==='center'?4.6:4.4);
    const g=ctx.createRadialGradient(p.sx,p.sy,0,p.sx,p.sy,glowR);
    const col = coral?'255,124,58':'235,230,240';
    g.addColorStop(0,`rgba(${col},${(n.kind==='center'?0.62:0.58)*depth})`);
    g.addColorStop(0.4,`rgba(${col},${(n.kind==='center'?0.22:0.2)*depth})`);
    g.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.sx,p.sy,glowR,0,7); ctx.fill();
    // core
    ctx.fillStyle = coral?`rgba(255,150,90,${0.95*depth})`:`rgba(255,255,255,${0.85*depth})`;
    ctx.beginPath(); ctx.arc(p.sx,p.sy,R,0,7); ctx.fill();
    // ring for center + hover (tol.is crosshair vibe)
    if(n.kind==='center'||isHover){
      ctx.strokeStyle=`rgba(255,124,58,${0.5*depth})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,R+7,0,7); ctx.stroke();
      if(isHover){ // crosshair
        ctx.strokeStyle='rgba(255,124,58,.4)';ctx.lineWidth=.7;
        ctx.beginPath();ctx.moveTo(p.sx-R-14,p.sy);ctx.lineTo(p.sx+R+14,p.sy);
        ctx.moveTo(p.sx,p.sy-R-14);ctx.lineTo(p.sx,p.sy+R+14);ctx.stroke();
      }
    }
    if(n.current && !isHover){ // 低调的"当前站点"标记 —— 明显区别于中心的小耳(不用珊瑚色/不发大光)
      ctx.save(); ctx.setLineDash([2,3]);
      ctx.strokeStyle=`rgba(230,230,240,${0.32*depth})`; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,R+9,0,7); ctx.stroke();
      ctx.restore();
      ctx.textAlign='center'; ctx.font='8px "Cutive Mono",monospace';
      ctx.fillStyle=`rgba(215,215,228,${0.42*depth})`;
      ctx.fillText('· 你在这里 ·', p.sx, p.sy + R + 15);
      ctx.textAlign='left';
    }
    // labels: center always; cats always; leaves when hover or near-front
    const showLabel = n.kind==='center'||n.kind==='cat'||n.kind==='subhub'||n.current || isHover
      || (n.kind==='leaf'&&p.persp>0.82) || (n.kind==='sub'&&(isHover||p.persp>0.92));
    if(n.kind==='center'){
      // 中心小耳：小耳 / XIAOER / 三个身份 叠成一栈
      ctx.textAlign='left'; ctx.textBaseline='middle';
      const ox=R+12;
      ctx.font=`500 18px "Noto Serif SC","Cutive Mono",monospace`;
      ctx.fillStyle='rgba(255,150,90,1)';
      ctx.fillText(n.label, p.sx+ox, p.sy-24);
      ctx.font='10px "Cutive Mono",monospace';
      ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.fillText((n.en||'').toUpperCase(), p.sx+ox, p.sy-8);
      const roles=(n.sub||'').split(/[×·・]/).map(s=>s.trim()).filter(Boolean).slice(0,3);
      ctx.font='9px "Cutive Mono",monospace';
      roles.forEach((rl,ri)=>{
        ctx.fillStyle='rgba(255,150,90,.6)';
        ctx.fillText(rl, p.sx+ox, p.sy+9+ri*13);
      });
    }else if(showLabel){
      const fs = (n.kind==='cat'?13:(n.kind==='subhub'?12:(n.kind==='sub'?10:11)));
      const la = (isHover?1:0.5*depth+0.2);
      ctx.textAlign='left'; ctx.textBaseline='middle';
      const ox=R+10;
      // zh
      ctx.font=`${n.kind==='leaf'?'':'500 '}${fs}px "Noto Serif SC","Cutive Mono",monospace`;
      ctx.fillStyle= coral?`rgba(255,150,90,${la})`:`rgba(255,255,255,${la})`;
      ctx.fillText(n.label, p.sx+ox, p.sy - (n.en?5:0));
      // en / sub
      if(n.en){
        ctx.font=`${Math.max(8,fs*0.62)}px "Cutive Mono",monospace`;
        ctx.fillStyle=`rgba(255,255,255,${0.35*la+0.1})`;
        ctx.fillText(n.en.toUpperCase(), p.sx+ox, p.sy + fs*0.62);
      }
    }
  }
  // center intro (bottom center) when hovering center or idle
  requestAnimationFrame(frame);
}

// ── boot: fetch Notion, fallback ──
(async function(){
  let data=FALLBACK;
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j && (j.children||j.nodes)) data=j; }
  }catch(e){}
  buildGraph(data);
  document.getElementById('hudCount').textContent=NODES.length;
  frame();
})();
</script>
</body>
