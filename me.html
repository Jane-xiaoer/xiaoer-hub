// ── build nodes with 3D positions (center + categories on a sphere + leaves near cat) ──
let NODES = [], LINKS = [];

// ── deep background starfield (3D, rotates with the scene → 浩瀚星空) ──
const BGSTARS = (function(){
  const a=[];
  for(let i=0;i<820;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const R=520+Math.random()*1450;
    a.push({ x:R*Math.sin(ph)*Math.cos(th), y:R*Math.cos(ph), z:R*Math.sin(ph)*Math.sin(th),
      b:0.22+Math.random()*0.78, tw:Math.random()*6.283, sz:Math.random()<0.13?2.0:1.05,
      warm:Math.random()<0.16 });
  }
  return a;
})();
function fib(i, n){ // fibonacci sphere direction
  const phi = Math.acos(1 - 2*(i+0.5)/n);
  const th  = Math.PI*(1+Math.sqrt(5))*(i+0.5);
  return [Math.sin(phi)*Math.cos(th), Math.cos(phi)*0.72, Math.sin(phi)*Math.sin(th)];
}
function buildGraph(root){
  NODES=[]; LINKS=[];
  const R1=255;
  const center={ id:'me', kind:'center', label:root.label||'小耳', en:root.en||'Xiaoer',
    sub:root.identity||root.sub||'', intro:root.hover||root.subtitle||'', introEn:root.hoverEn||HOVER_EN,
    about:root.about||null, action:root.action||'进一步认识小耳', url:'',
    x:0,y:0,z:0, r:9.5 };
  NODES.push(center);

  // 1) 组装"臂":把大子枢纽(奇物录/馆藏站)提升为独立臂,与类目并列 —— 均衡 360°,不再一坨挂在"网站作品"下
  const arms=[];
  (root.children||[]).forEach(cat=>{
    const leaves=(cat.children||cat.nodes||[]);
    const plain=[];
    leaves.forEach(lf=>{
      const enr=ENRICH[lf.label];
      if(enr) arms.push({ kind:'subhub', label:lf.label, en:lf.en||'', url:lf.url||lf.href||'',
                          current:!!enr.current, kids:enr.subs, childKind:'sub' });
      else plain.push(lf);
    });
    if(plain.length || !leaves.length) arms.push({ kind:'cat', label:cat.label, en:cat.en||'', url:'', kids:plain, childKind:'leaf' });
  });

  // 2) 大小交错排列 —— 让子节点多的重臂彼此隔开(配合 golden-angle 相邻方向相距 ~137°)
  arms.forEach(a=> a.w = (a.kids?a.kids.length:0));
  arms.sort((a,b)=> b.w - a.w);
  const ordered=[]; let i=0, j=arms.length-1;
  while(i<=j){ ordered.push(arms[i++]); if(i<=j) ordered.push(arms[j--]); }

  // 3) 逐臂布置:臂节点落在 R1 球面,子节点绕其铺开(子越多铺得越大,密度趋于均匀)
  ordered.forEach((arm,ai)=>{
    const d=fib(ai, ordered.length);
    const ax=d[0]*R1, ay=d[1]*R1, az=d[2]*R1;
    const anode={ id:'arm'+ai, kind:arm.kind, label:arm.label, en:arm.en, sub:arm.en, intro:'', url:arm.url||'',
      current:arm.current, x:ax,y:ay,z:az, r: arm.kind==='subhub'?4.4:4.9 };
    NODES.push(anode); LINKS.push([center,anode]);
    const kids=arm.kids||[];
    const up=Math.abs(d[1])>0.9?[1,0,0]:[0,1,0];
    const t1=norm(cross(d,up)), t2=norm(cross(d,t1));
    const spread=66*(0.6+0.5*Math.sqrt(kids.length||1));
    kids.forEach((kf,ki)=>{
      const a=(ki/Math.max(1,kids.length))*Math.PI*2 + ai*1.3;
      const rr=spread*(0.78+0.34*Math.random());
      const kx=ax+(Math.cos(a)*t1[0]+Math.sin(a)*t2[0])*rr + d[0]*44;
      const ky=ay+(Math.cos(a)*t1[1]+Math.sin(a)*t2[1])*rr + d[1]*44;
      const kz=az+(Math.cos(a)*t1[2]+Math.sin(a)*t2[2])*rr + d[2]*44;
      const knode={ id:'k'+ai+'_'+ki, kind:arm.childKind, label:kf.label, en:kf.en||'', sub:kf.en||'',
        intro:(kf.url||kf.href||''), url:kf.url||kf.href||'',
        x:kx,y:ky,z:kz, r: arm.kind==='subhub'?2.2:3 };
      NODES.push(knode); LINKS.push([anode,knode]);
    });
  });
}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}

// ── 星空转动手感(光标特效由 js/cursor-fx.js 负责,这两个参数搭它的调参面板) ──

  inertia :{label:'拖拽惯性',min:0.80,max:0.98,step:0.005,value:0.98},   // 松手后滑多久 ← Jane 2026-08-04 拖定(拉满,要长滑行)
  autoSpin:{label:'自转速度',min:0,max:0.0008,step:0.00001,value:0.00046} // ← Jane 拖定(比原来 0.00017 快一倍多)
});
const SPIN=(window.CursorFX&&CursorFX.ext)||{inertia:0.98,autoSpin:0.00046};

// ── rotation + projection ──
let yaw=0.3, pitch=-0.15, autoYaw=0;
let zoom=1;
const lineMode=1; // 常态连线=灰色虚线(锁定)
const HL_PALETTES={ blue:[74,164,255] }; // 悬停高亮=蓝(珊瑚橙互补色,锁定)
const hlKey='blue';
let dragging=false, lx=0, ly=0, moved=false;
let vYaw=0, vPitch=0;                    // 拖拽甩出去的角速度 —— 松手后继续滑行
cv.addEventListener('mousedown',e=>{
  dragging=true;moved=false;lx=e.clientX;ly=e.clientY;
  vYaw=0;vPitch=0;                        // 手按住 = 抓停,别跟惯性打架
  document.documentElement.classList.add('dragging');
});
window.addEventListener('mouseup',()=>{
  dragging=false;
  vYaw*=0.55; vPitch*=0.55; // 只带走一半手速 —— 否则松手后滑出去比拖的还远
  document.documentElement.classList.remove('dragging');
});
window.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  if(!dragging)return;
  const dx=e.clientX-lx, dy=e.clientY-ly;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  const ay=dx*0.006, ap=dy*0.005;
  yaw+=ay; pitch=Math.max(-1.2,Math.min(1.2,pitch+ap));
  vYaw=vYaw*0.6+ay*0.4; vPitch=vPitch*0.6+ap*0.4;  // 平滑取最近的手速
  lx=e.clientX;ly=e.clientY;
});
window.addEventListener('wheel',e=>{
  if(aboutOverlay.classList.contains('show')) return; // 浮层打开时让它正常下拉滚动
  e.preventDefault();
  zoom=Math.max(.55,Math.min(2.4,zoom*(e.deltaY>0?0.92:1.08)));
},{passive:false});
let mx=-9999,my=-9999; // 初始鼠标在屏外 —— 加载先是安静星空,移上去才高亮

function project(n){
  // rotate by yaw (around Y) then pitch (around X)
  const cy=Math.cos(yaw+autoYaw),sy=Math.sin(yaw+autoYaw);
  let x=n.x*cy - n.z*sy, z=n.x*sy + n.z*cy, y=n.y;
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  let y2=y*cp - z*sp, z2=y*sp + z*cp;
  const persp=420/(420 + z2); // perspective
  const s=persp*zoom;
  return { sx:W/2 + x*s, sy:H/2 + y2*s, z:z2, scale:s, persp };
}

// ── interaction: hover nearest projected node ──
let hover=null;
cv.addEventListener('click',()=>{
  if(moved)return;
  if(hover && hover.kind==='center') openAbout();
  else if(hover && hover.url) window.open(hover.url,'_blank','noopener');
});
// 压到星点上时,让光标环吸到那颗星上并收紧(环随透视近大远小)
if(window.CursorFX) CursorFX.snap=()=>{
  if(!hover||!hover._p) return null;
  const p=hover._p;
  return { x:p.sx, y:p.sy, r:hover.r*(0.35+0.7*p.persp)*zoom*1.35 + 11 };
};

// ── render loop ──
function frame(){
  autoYaw += dragging?0:SPIN.autoSpin;
  if(!dragging && (Math.abs(vYaw)>1e-5 || Math.abs(vPitch)>1e-5)){ // 松手后的滑行
    yaw+=vYaw; pitch=Math.max(-1.2,Math.min(1.2,pitch+vPitch));
    vYaw*=SPIN.inertia; vPitch*=SPIN.inertia;
  }
  ctx.clearRect(0,0,W,H);
  // deep background starfield (behind everything)
  const now=performance.now()*0.001;
  for(const s of BGSTARS){
    const p=project(s);
    if(p.persp<=0.04) continue;
    const tw=0.6+0.4*Math.sin(now*1.2+s.tw);
    const al=s.b*tw*Math.min(1,p.persp*1.3);
    if(al<0.02) continue;
    ctx.fillStyle=s.warm?`rgba(255,205,170,${al})`:`rgba(240,244,255,${al})`;
    ctx.beginPath(); ctx.arc(p.sx,p.sy,Math.max(0.4,s.sz*p.persp),0,7); ctx.fill();
  }
  // compute projections
  const P = NODES.map(project);
  // hover pick (nearest within radius)
  hover=null; let best=1e9;
  for(let i=0;i<NODES.length;i++){
    const p=P[i]; const dd=Math.hypot(p.sx-mx,p.sy-my);
    const hitR = Math.max(14, NODES[i].r*p.scale+10);
    if(dd<hitR && dd<best){best=dd;hover=NODES[i];hover._p=p;}
  }
  updateInfo(hover);
  if(!dragging) cv.style.cursor = hover ? 'pointer' : 'grab'; // 开了准星光标时会被 cfx-on 盖成 none
  // 悬停时:直连的邻居节点集合 —— 用金黄色高亮,让"当前选中的这一串"从旋转背景里跳出来
  const nbr=new Set();
  if(hover){ for(const L of LINKS){ if(L[0]===hover)nbr.add(L[1]); else if(L[1]===hover)nbr.add(L[0]); } }
  // links (draw back-to-front by mid z)
  const order=LINKS.map((L,i)=>({i,z:(project(L[0]).z+project(L[1]).z)/2})).sort((a,b)=>a.z-b.z);
  if(lineMode!==2) for(const {i} of order){
    const a=P[NODES.indexOf(LINKS[i][0])], b=P[NODES.indexOf(LINKS[i][1])];
    const active = hover && (LINKS[i][0]===hover||LINKS[i][1]===hover);
    // 星空里连线本是眼睛脑补的 —— 两端在星点处淡出,只在中段留一缕微光,视觉上更短更含蓄
    const mid=(a.persp+b.persp)/2;
    const A = active ? Math.min(0.7, (0.06+0.1*mid)*6) : Math.min(0.28, 0.1+0.13*mid);
    const col = active ? HL_PALETTES[hlKey].join(',') : '196,194,206'; // 静止=灰线,hover=蓝高亮
    ctx.lineWidth = active?1.15:0.7;
    // 两端往内收 —— 连线更短,在星点附近留出空隙(不扎进大光晕)
    const tr=0.26, ax=a.sx+(b.sx-a.sx)*tr, ay=a.sy+(b.sy-a.sy)*tr, bx=b.sx-(b.sx-a.sx)*tr, by=b.sy-(b.sy-a.sy)*tr;
    if(lineMode===1){ // 虚线(faint dashed)
      ctx.save(); ctx.setLineDash([2,6]);
      ctx.strokeStyle=`rgba(${col},${A})`;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
      ctx.restore();
    }else{ // 0: 常态连续细线(中段清晰,两端略淡)
      const grad = ctx.createLinearGradient(ax,ay,bx,by);
      grad.addColorStop(0,`rgba(${col},${A*0.55})`);
      grad.addColorStop(0.5,`rgba(${col},${A})`);
      grad.addColorStop(1,`rgba(${col},${A*0.55})`);
      ctx.strokeStyle=grad;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    }
  }
  // nodes back-to-front
  const nodeOrder=NODES.map((n,i)=>({i,z:P[i].z})).sort((a,b)=>a.z-b.z);
  for(const {i} of nodeOrder){
    const n=NODES[i], p=P[i];
    const depth=Math.max(0.25,p.persp);
    const isHover = hover===n;
    const coral = n.kind==='center' || isHover;
    const gold = !coral && nbr.has(n); // 邻居高亮(蓝/黄)
    const hlc = HL_PALETTES[hlKey];
    // 近大远小 —— 放开透视,让近处的点明显大于远处(Jane 觉得这样更舒服);邻居略放大
    const R=n.r*(0.35+0.7*p.persp)*zoom*(isHover?1.35:(gold?1.18:1));
    // glow —— 光晕更大更饱满,让星点自身发光、压过连线(浩瀚星空感)
    // 光晕收紧成一圈 halo,让亮白核心清晰凸出(像 Jane 要的第二张:亮点 + 光环,而非糊团)
    const glowR = R*(n.kind==='center'?4.3:4.1);
    const g=ctx.createRadialGradient(p.sx,p.sy,0,p.sx,p.sy,glowR);
    const col = coral?'255,124,58':(gold?hlc.join(','):'240,236,246');
    const gi = gold?0.85:(n.kind==='center'?0.82:0.8); // 内圈亮度
    const gm = gold?0.32:(n.kind==='center'?0.3:0.28);  // 中圈亮度
    g.addColorStop(0,`rgba(${col},${gi*depth})`);
    g.addColorStop(0.35,`rgba(${col},${gm*depth})`);
    g.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.sx,p.sy,glowR,0,7); ctx.fill();
    // core —— 亮白实心核心,清爽凸出
    ctx.fillStyle = coral?`rgba(255,158,100,${0.98*depth})`:(gold?`rgba(${Math.min(255,hlc[0]+50)},${Math.min(255,hlc[1]+40)},${Math.min(255,hlc[2]+25)},${0.98*depth})`:`rgba(255,255,255,${0.96*depth})`);
    ctx.beginPath(); ctx.arc(p.sx,p.sy,R,0,7); ctx.fill();
    // 邻居高亮环
    if(gold){
      ctx.strokeStyle=`rgba(${hlc.join(',')},${0.55*depth})`; ctx.lineWidth=0.9;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,R+5,0,7); ctx.stroke();
    }
    // ring for center + hover (tol.is crosshair vibe)
    if(n.kind==='center'||isHover){
      ctx.strokeStyle=`rgba(255,124,58,${0.5*depth})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,R+7,0,7); ctx.stroke();
      if(isHover){ // crosshair
        ctx.strokeStyle='rgba(255,124,58,.4)';ctx.lineWidth=.7;
        ctx.beginPath();ctx.moveTo(p.sx-R-14,p.sy);ctx.lineTo(p.sx+R+14,p.sy);
        ctx.moveTo(p.sx,p.sy-R-14);ctx.lineTo(p.sx,p.sy+R+14);ctx.stroke();
      }
    }
    if(n.current && !isHover){ // 低调的"当前站点"标记 —— 明显区别于中心的小耳(不用珊瑚色/不发大光)
      ctx.save(); ctx.setLineDash([2,3]);
      ctx.strokeStyle=`rgba(230,230,240,${0.32*depth})`; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,R+9,0,7); ctx.stroke();
      ctx.restore();
      ctx.textAlign='center'; ctx.font='8px "Cutive Mono",monospace';
      ctx.fillStyle=`rgba(215,215,228,${0.42*depth})`;
      ctx.fillText('· 你在这里 ·', p.sx, p.sy + R + 15);
      ctx.textAlign='left';
    }
    // labels: center always; cats always; leaves when hover or near-front
    const showLabel = n.kind==='center'||n.kind==='cat'||n.kind==='subhub'||n.current || isHover || gold
      || (n.kind==='leaf'&&p.persp>0.82) || (n.kind==='sub'&&(isHover||p.persp>0.92));
    if(n.kind==='center'){
      // 中心小耳：小耳 / XIAOER / 三个身份 叠成一栈
      ctx.textAlign='left'; ctx.textBaseline='middle';
      const ox=R+12;
      ctx.font=`500 18px "Noto Serif SC","Cutive Mono",monospace`;
      ctx.fillStyle='rgba(255,150,90,1)';
      ctx.fillText(n.label, p.sx+ox, p.sy-24);
      ctx.font='10px "Cutive Mono",monospace';
      ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.fillText((n.en||'').toUpperCase(), p.sx+ox, p.sy-8);
      const roles=(n.sub||'').split(/[×·・]/).map(s=>s.trim()).filter(Boolean).slice(0,3);
      ctx.font='9px "Cutive Mono",monospace';
      roles.forEach((rl,ri)=>{
        ctx.fillStyle='rgba(255,150,90,.6)';
        ctx.fillText(rl, p.sx+ox, p.sy+9+ri*13);
      });
    }else if(showLabel){
      const fs = (n.kind==='cat'?13:(n.kind==='subhub'?12:(n.kind==='sub'?10:11)));
      const la = (isHover||gold?1:0.5*depth+0.2);
      ctx.textAlign='left'; ctx.textBaseline='middle';
      const ox=R+10;
      // zh
      ctx.font=`${n.kind==='leaf'?'':'500 '}${fs}px "Noto Serif SC","Cutive Mono",monospace`;
      ctx.fillStyle= coral?`rgba(255,150,90,${la})`:(gold?`rgba(${HL_PALETTES[hlKey].join(',')},${la})`:`rgba(255,255,255,${la})`);
      ctx.fillText(n.label, p.sx+ox, p.sy - (n.en?5:0));
      // en / sub
      if(n.en){
        ctx.font=`${Math.max(8,fs*0.62)}px "Cutive Mono",monospace`;
        ctx.fillStyle=`rgba(255,255,255,${0.35*la+0.1})`;
        ctx.fillText(n.en.toUpperCase(), p.sx+ox, p.sy + fs*0.62);
      }
    }
  }
  requestAnimationFrame(frame);
}

// ── boot: fetch Notion, fallback ──
(async function(){
  let data=FALLBACK;
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j && (j.children||j.nodes)) data=j; }
  }catch(e){}
  buildGraph(data);
  document.getElementById('hudCount').textContent=NODES.length;
  frame();
})();
</script>
</body>
</html>
